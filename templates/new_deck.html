<!DOCTYPE html>
<head>
    <title>New deck</title>
</head>

<body>
    <h2>Create a new deck</h2>
    {% for message in get_flashed_messages() %}
    <h3><b>{{ message }}</b></h3>
    {% endfor %}
    <form action="/create_deck" method="post">
        <p>
        <label for="deck_name">Deck name:</label><br />
        <input type="text" id="deck_name" name="name" value="{{ deck_name }}" required maxlength="30"/>
        </p>
        <p>
        <label for="deck_description">Enter description:</label><br />
        <textarea id="deck_description" name="description" rows="5" cols="40" required maxlength="150">{{ description }}</textarea>
        </p>
        <p><b>Cards:</b></p>
        {% for card in cards %}
        <div>
            <hr />
            <p>Card {{ loop.index }}</p>
            <p>
            <label for="question{{ loop.index }}">Question:</label><br />
            <input type="text" id="question{{ loop.index }}" name="questions[]" value="{{ card['question'] }}" required maxlength="60"/>
            </p>
            <p>
            <label for="answer{{ loop.index }}">Answer:</label><br />
            <input type="text" id="answer{{ loop.index }}" name="answers[]" value="{{ card['answer'] }}" required maxlength="60"/>
            </p>
        </div>
        {% endfor %}
        <p>
        <button type="submit" formaction="/add_card_field">New card</button>
        </p>
        <hr />
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"/>
        <input type="submit" value="Create Deck">
    </form>
</body>
</html>
