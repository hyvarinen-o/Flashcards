<!DOCTYPE html>
<head>
    <title>Results for {{ query }}</title>
    <link rel="stylesheet" href="/static/main.css"/>
</head>

<body>
    {% if results == [] %}
        <h2><b>No results for keyword: "{{ query }}"</b></h2>
    {% else %}
    <h2><b>{{ results|length }} results for keyword: "{{ query }}"</b></h2>
    <div class="content">
        {% for r in results %}
        <hr />
        Deck name: <a href="/deck/{{r.deck_id}}">{{ r.name }}</a>
        <p></p>
        created at: <b>{{ r.created_at }}</b>, by <b>{{ r.username }}</b>
        {% endfor %}
        <p></p>
    </div>
    {% endif %}
    <hr />
    <a href="/" class="btn"> Back to Frontpage</a>
</body>
