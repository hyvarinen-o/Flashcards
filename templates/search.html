<!DOCTYPE html>
<head>
    <title>test</title>
</head>

<body>
    {% if results == [] %}
    <h2><b>No results for keyword: "{{ query }}"</b></h2>
    {% else %}
    <h2><b>{{ results|length }} results for keyword: "{{ query }}"</b></h2>
    {% for r in results %}
    <hr />
    <a href="/deck/{{r.deck_id}}">{{ r.name }}</a>
    <p></p>
    created at: <b>{{ r.created_at }}</b>, by <b>{{ r.username }}</b>
    {% endfor %}
    <p></p>
    {% endif %}
    <a href="/"> Go back</a>
</body>
