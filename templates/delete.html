<!DOCTYPE html>
<head>
    <title>Verify deletion</title>
    <link rel="stylesheet" href="/static/main.css"/>
</head>

<body>
    <div class="header">
        <h2><b>Are you sure you want to delete this deck?</b></h2>
    </div>
    <div class="content">
        <form action="/delete_deck/{{ deck_id }}" method="post">
            <p>
            <label for="confirm_delete">Confirm deletion:</label> 
            <input type="submit" id="confirm_delete" value="Delete" />
            </p>
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"/>
        </form>
        <p></p>
    </div>
    <br/>
    <a href="/deck/{{ deck_id }}" class="btn">No, go back</a>
</body>
