<!DOCTYPE html>
<head>
    <title>register</title>
</head>

<body>
    <h2><b>Register</b></h2>
    {% for message in get_flashed_messages() %}
    <p><b>{{ message }}</b></p>
    {% endfor %}
    <form action="/register", method="post">
        <p>Enter username (max 30 characters)</p>
        <input type="text" name="username" required maxlenght="30" value="{{ filled.username }}"/>
        <p>Enter password</p>
        <input type="text" name="password1" required maxlenght="200"/>
        <p>Enter password again</p>
        <input type="text" name="password2" required maxlength="200"/>
        <br>
        <input type="submit" value="create" />
    </form>
    <p><a href="/">Go back</a></p>
</body>
