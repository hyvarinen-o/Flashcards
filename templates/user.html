<!DOCTYPE html>
<head>
    <title>Flashcards - {{ user.username }}</title>
</head>

<body>
    <h2>User {{ user.username }}</h2>
    <p>Join date {{ user.created_at }}</p>
    <p>Decks created: {{ decks|length }}</p>
    <h3>{{ user.username }}'s decks</h3>
    {% for deck in decks %}
    <hr />
    <a href="/deck/{{ deck.id }}">{{ deck.name }}</a> - Cards: {{ deck.total }}</p>
    <p><b>Description:</b> {{ deck.description }}</p>
    <p>by {{ user   .username }} at {{ deck.created_at }}</p>
    {% endfor %}
</body>
